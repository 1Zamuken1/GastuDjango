{% extends "base.html" %}
{% block vista %}
    <div class="pr-2 overflow-y-auto max-h-[65vh]">
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
            {% for p in presupuestos %}
                <div class="p-5 transition border border-gray-300 shadow-md bg-slate-300 rounded-xl hover:shadow-lg">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-slate-900">
                            {{ p.categoria.nombre }}
                        </h3>
                        {% if p.isActivo %}
                            <span class="px-3 py-1 text-xs font-semibold text-green-700 bg-green-100 rounded-full">
                                Activo
                            </span>
                        {% else %}
                            <span class="px-3 py-1 text-xs font-semibold text-red-700 bg-red-100 rounded-full">
                                Inactivo
                            </span>
                        {% endif %}
                    </div>
                    <div class="space-y-1 text-sm text-gray-700">
                        <p>
                            <b>Inicio:</b> {{ p.fecha_inicio }}
                        </p>
                        <p>
                            <b>Fin:</b> {{ p.fecha_fin }}
                        </p>
                        <p class="mt-2 text-lg font-bold text-mauve-700">
                            $ {{ p.limite }}
                        </p>
                    </div>
                    <div class="flex justify-end gap-2 mt-6">
                        <button
                            onclick="abrirModalEditar('{{ p.id }}')"
                            class="p-2 text-white transition rounded-lg bg-amber-600 hover:bg-amber-800"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="w-5 h-5"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Z"
                                />
                            </svg>
                        </button>
                        <button
                            onclick="abrirModalEliminar('{{ p.id }}')"
                            class="p-2 text-white transition bg-red-600 rounded-lg hover:bg-red-700"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="w-5 h-5"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673A2.25 2.25 0 0 1 15.916 21H8.084a2.25 2.25 0 0 1-2.245-1.327L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.021-2.09 2.201v.916"
                                />
                            </svg>
                        </button>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
