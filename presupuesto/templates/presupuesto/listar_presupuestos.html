{% extends "base_presupuesto.html" %}
 
{% block presupuestos_content %}
    <!-- ========================================================================================================================== -->
    <div id="cards-presupuesto" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px;">
      <!-- CARGAR TARJETAS DE PRESUPUESTO -->
    </div>
    <!-- ========================================================================================================================== -->
    <!-- MODAL CREAR PRESUPUESTO -->
    <!-- ========================================================================================================================== -->
    <div id="modal-crear" class="modal-overlay" style="display:none;">
      <div class="modal-container">
        <h3 class="modal-title">Crear presupuesto</h3>
        <form id="form-crear" class="modal-form">
          <div class="form-group">
            <label>Límite</label>
            <input type="number" id="limite" class="form-input" placeholder="0.0" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <select id="categoria" class="form-input">
              <option value="">Cargando...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fecha inicio</label>
            <input type="date" id="fecha_inicio" class="form-input">
          </div>
          <div class="form-group">
            <label>Fecha fin</label>
            <input type="date" id="fecha_fin" class="form-input">
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-guardar">Guardar</button>
            <button type="button" class="btn-cancelar" onclick="cerrarModal('modal-crear')">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
    <!-- ========================================================================================================================== -->
    <!-- MODAL EDITAR PRESUPUESTO -->
    <!-- ========================================================================================================================== -->
    <div id="modal-editar" class="modal-overlay" style="display:none;">
      <div class="modal-container">
        <h3 class="modal-title">Editar presupuesto</h3>
        <form id="form-editar" class="modal-form">
          <input type="hidden" id="editar-id">
          <div class="form-group">
            <label>Límite</label>
            <input type="number" id="editar-limite" class="form-input" placeholder="0.0" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <select id="editar-categoria" class="form-input"></select>
          </div>
          <div class="form-group">
            <label>Fecha inicio</label>
            <input type="date" id="editar-fecha_inicio" class="form-input">
          </div>
          <div class="form-group">
            <label>Fecha fin</label>
            <input type="date" id="editar-fecha_fin" class="form-input">
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-guardar">Guardar cambios</button>
            <button type="button" class="btn-cancelar" onclick="cerrarModal('modal-editar')">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
    <!-- ========================================================================================================================== -->
{% endblock %}
 
{% block presupuestos_scripts %}
<script>
  const csrfToken = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''
  // ── Registro de alertas ya mostradas por nivel ─────────────────────
  const alertasMostradas = new Set()

 
  // ── Helpers de modal ────────────────────────────────────────────────────────
  function abrirModal(id) {
    document.getElementById(id).style.display = 'flex'
  }
  function cerrarModal(id) {
    document.getElementById(id).style.display = 'none'
  }
  // Cierra modal al hacer click fuera del contenedor
  document.addEventListener('click', function(e) {
    ['modal-crear', 'modal-editar'].forEach(id => {
      const overlay = document.getElementById(id)
      if (e.target === overlay) cerrarModal(id)
    })
  })
 
  // ── Cargar presupuestos ──────────────────────────────────────────────────────
    function cargarPresupuestos() {
    Promise.all([
      fetch('/api/presupuestos/', { credentials: 'same-origin' }).then(r => r.json()),
      fetch('/api/presupuestos/alertas/', { credentials: 'same-origin' }).then(r => r.json())
    ])
    .then(([presupuestos, alertasData]) => {
      const alertas = alertasData.alertas
      const contenedor = document.getElementById('cards-presupuesto')
      contenedor.innerHTML = ''

      presupuestos.forEach(p => {
        // Buscar alerta correspondiente
        const alerta = alertas.find(a => 
          a.categoria.trim().toLowerCase() === p.categoria_nombre.trim().toLowerCase()
        )

        let color = '#22c55e' // verde
        let texto = 'Normal'
        let mensaje = ''

        if (alerta) {
          // Determinar color, texto y mensaje según nivel
          if (alerta.alerta === 'media') {
            color = '#facc15'
            texto = 'Cuidado'
            mensaje = `Estás usando el 50%-80% de tu presupuesto en ${p.categoria_nombre}, vigila tus gastos.`
          } else if (alerta.alerta === 'alta') {
            color = '#f97316'
            texto = 'Alerta'
            mensaje = `Has gastado más del 80% del presupuesto en ${p.categoria_nombre}, ¡reduce tus gastos!`
          } else if (alerta.alerta === 'critica') {
            color = '#ef4444'
            texto = 'Crítico'
            mensaje = `¡Has superado el límite de ${p.categoria_nombre}! Controla tus gastos inmediatamente.`
          }

          // Mostrar SweetAlert solo si el nivel aún no se mostró
          if (mensaje) {
            const key = p.categoria_nombre + '-' + alerta.alerta
            if (!alertasMostradas.has(key)) {
              Swal.fire({
                icon: 'warning',
                title: `Alerta: ${p.categoria_nombre}`,
                text: mensaje,
                confirmButtonColor: color
              })
              alertasMostradas.add(key) // marcar este nivel como mostrado
            }
          }
        }

        // ── Crear tarjeta visual ─────────────────────────────────────
        const limite = parseFloat(p.limite).toLocaleString('es-CO', {
          style: 'currency', currency: 'COP', maximumFractionDigits: 0
        })

        const gastado = alerta ? alerta.gastado.toLocaleString('es-CO') : '0'
        const porcentaje = alerta ? alerta.porcentaje : 0

        const card = document.createElement('div')
        card.className = 'app-card card-presupuesto'

        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-limite">${limite}</div>
              <div class="card-categoria">${p.categoria_nombre}</div>
            </div>
            <span class="card-badge ${p.isActivo ? 'activo' : 'inactivo'}">
              ${p.isActivo ? 'Activo' : 'Inactivo'}
            </span>
          </div>

          <div class="card-body">
            <div style="margin-bottom:10px;">
              <div style="font-size:12px;">${porcentaje}% usado</div>
              <div style="background:#e5e7eb; height:6px; border-radius:4px;">
                <div style="
                  width:${porcentaje}%;
                  background:${color};
                  height:6px;
                  border-radius:4px;">
                </div>
              </div>
            </div>

            <div class="card-row">
              <span class="card-label">Gastado</span>
              <span class="card-value">$${gastado}</span>
            </div>

            <div class="card-row">
              <span class="card-label">Estado</span>
              <span class="card-value" style="color:${color}; font-weight:bold;">
                ${texto}
              </span>
            </div>

            <div class="card-row">
              <span class="card-label">Fecha inicio</span>
              <span class="card-value">${p.fecha_inicio}</span>
            </div>

            <div class="card-row">
              <span class="card-label">Fecha fin</span>
              <span class="card-value">${p.fecha_fin}</span>
            </div>
          </div>

          <div class="card-footer">
            <button onclick="togglePresupuesto(${p.id}, ${p.isActivo})" class="card-btn toggle">
              ${p.isActivo ? 'Desactivar' : 'Activar'}
            </button>
            <button onclick="editarPresupuesto(${p.id})" class="card-btn">
              Editar
            </button>
            <button onclick="eliminarPresupuesto(${p.id})" class="card-btn danger">
              Eliminar
            </button>
          </div>
        `
        contenedor.appendChild(card)
      })
    })
  }
  // ── Toggle activo/inactivo ───────────────────────────────────────────────────
  function togglePresupuesto(id, isActivo) {
    Swal.fire({
      title: isActivo ? '¿Desactivar presupuesto?' : '¿Activar presupuesto?',
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Sí',
      cancelButtonText: 'Cancelar',
      confirmButtonColor: isActivo ? '#e11d48' : '#10b981',
    }).then(result => {
      if (!result.isConfirmed) return
      fetch(`/api/presupuestos/${id}/`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
        credentials: 'same-origin',
        body: JSON.stringify({ isActivo: !isActivo })
      })
        .then(r => r.json())
        .then(() => {
          Swal.fire({ icon: 'success', title: isActivo ? 'Desactivado' : 'Activado', timer: 1500, showConfirmButton: false })
          cargarPresupuestos()
        })
        .catch(() => Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo actualizar.' }))
    })
  }
 
  // ── Cargar categorías en un <select> ────────────────────────────────────────
  function cargarCategorias(selectId, valorSeleccionado = null) {
    return fetch('/api/categorias/', { credentials: 'same-origin' })
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById(selectId)
        select.innerHTML = '<option value="">Seleccione una categoría</option>'
        data.categorias.forEach(cat => {
          const option = document.createElement('option')
          option.value = cat.id
          option.textContent = cat.nombre
          if (valorSeleccionado && cat.id == valorSeleccionado) option.selected = true
          select.appendChild(option)
        })
      })
  }
 
  // ── Crear presupuesto ────────────────────────────────────────────────────────
  // Abrir modal crear (llamado desde base_presupuesto.html)
  function abrirModalCrear() {
    document.getElementById('form-crear').reset()
    cargarCategorias('categoria')
    abrirModal('modal-crear')
  }
 
  document.getElementById('form-crear').addEventListener('submit', function(e) {
    e.preventDefault()
 
    const body = {
      limite:       document.getElementById('limite').value,
      categoria:    document.getElementById('categoria').value,
      fecha_inicio: document.getElementById('fecha_inicio').value,
      fecha_fin:    document.getElementById('fecha_fin').value,
      isActivo: true
    }

    if (!categoria) {
      Swal.fire({
        icon: 'warning',
        title: 'Falta categoría',
        text: 'Debes seleccionar una categoría'
      })
      return
    }
   
    fetch('/api/presupuestos/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    })
      .then(async r => {
        const data = await r.json()
        if (!r.ok) {
          const msg = Object.values(data).flat().join('\n')
          throw new Error(msg)
        }
        return data
      })
      .then(() => {
        cerrarModal('modal-crear')
        Swal.fire({ icon: 'success', title: 'Presupuesto creado', timer: 1500, showConfirmButton: false })
        cargarPresupuestos()
         console.log({
          limite,
          categoria,
          fecha_inicio,
          fecha_fin
        })
      })
      .catch(err => Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'No se pudo guardar.' }))
  })
 
  // ── Editar presupuesto ───────────────────────────────────────────────────────
  function editarPresupuesto(id) {
    fetch(`/api/presupuestos/${id}/`, { credentials: 'same-origin' })
      .then(r => r.json())
      .then(p => {
        document.getElementById('editar-id').value = p.id
        document.getElementById('editar-limite').value = p.limite
        document.getElementById('editar-fecha_inicio').value = p.fecha_inicio
        document.getElementById('editar-fecha_fin').value = p.fecha_fin
        return cargarCategorias('editar-categoria', p.categoria)
      })
      .then(() => abrirModal('modal-editar'))
      .catch(() => Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo cargar el presupuesto.' }))
  }
 
  document.getElementById('form-editar').addEventListener('submit', function(e) {
    e.preventDefault()
 
    const id = document.getElementById('editar-id').value
    const body = {
      limite: document.getElementById('editar-limite').value,
      categoria: document.getElementById('editar-categoria').value,
      fecha_inicio: document.getElementById('editar-fecha_inicio').value,
      fecha_fin: document.getElementById('editar-fecha_fin').value,
    }
 
    fetch(`/api/presupuestos/${id}/`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    })
      .then(async r => {
        const data = await r.json()
        if (!r.ok) throw new Error(Object.values(data).flat().join('\n'))
        return data
      })
      .then(() => {
        cerrarModal('modal-editar')
        Swal.fire({ icon: 'success', title: 'Cambios guardados', timer: 1500, showConfirmButton: false })
        cargarPresupuestos()
      })
      .catch(err => Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'No se pudo actualizar.' }))
  })
 
  // ── Eliminar presupuesto ─────────────────────────────────────────────────────
  function eliminarPresupuesto(id) {
    Swal.fire({
      title: '¿Eliminar presupuesto?',
      text: 'Esta acción no se puede deshacer.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar',
      confirmButtonColor: '#e11d48',
    }).then(result => {
      if (!result.isConfirmed) return
      fetch(`/api/presupuestos/${id}/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': csrfToken },
        credentials: 'same-origin',
      })
        .then(r => {
          if (!r.ok) throw new Error()
          Swal.fire({ icon: 'success', title: 'Eliminado', timer: 1500, showConfirmButton: false })
          cargarPresupuestos()
        })
        .catch(() => Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo eliminar.' }))
    })
  }
 
  // ── Init ─────────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => cargarPresupuestos())
</script>
{% endblock %}
