<div id="modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">

<div class="p-6 bg-white shadow-xl w-96 rounded-xl">

<h2 class="mb-6 text-xl font-semibold text-gray-800">
Crear presupuesto
</h2>

<form method="post" action="{% url 'crear_presupuesto' %}" class="space-y-5">

{% csrf_token %}

<div class="space-y-1">
<label class="text-sm font-medium text-gray-600">
Límite
</label>

<input 
type="number" 
name="limite"
class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
</div>

<div class="space-y-1">
<label class="text-sm font-medium text-gray-600">
Fecha inicio
</label>

<input 
type="date" 
name="fecha_inicio"
class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
</div>

<div class="space-y-1">
<label class="text-sm font-medium text-gray-600">
Fecha fin
</label>

<input 
type="date" 
name="fecha_fin"
class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
</div>

<div class="flex items-center gap-3 pt-1">

<input 
type="checkbox"
name="isActivo"
class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">

<label class="text-sm text-gray-700">
Activo
</label>

</div>

<div class="space-y-1">

<label class="text-sm font-medium text-gray-600">
Categoría
</label>

<input type="hidden" id="categoria_id" name="categoria">

<button 
type="button"
onclick="abrirModalCategorias()"
class="w-full px-3 py-2 text-left border border-gray-300 rounded-md bg-gray-50 hover:bg-gray-100">

Seleccionar categoría

</button>

{% include "presupuesto/modal_categorias.html" %}

</div>

<div class="flex justify-end gap-3 pt-4">

<button 
type="button"
onclick="cerrarModal()"
class="px-4 py-2 text-gray-700 border border-gray-300 rounded-md hover:bg-gray-100">

Cancelar

</button>

<button 
type="submit"
class="px-4 py-2 text-white bg-purple-600 rounded-md hover:bg-purple-700">

Guardar

</button>

</div>

</form>

</div>
</div>
