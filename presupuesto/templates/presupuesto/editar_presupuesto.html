<div id="modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
<div class="p-6 bg-white shadow-xl w-96 rounded-xl">

<h2 class="mb-6 text-xl font-semibold text-gray-700">Editar presupuesto</h2>

<form method="post" action="{% url 'confirmar_editar_presupuesto' presupuesto.id %}">
{% csrf_token %}

<div>
<label class="block mb-1 text-sm font-medium text-gray-600">Limite</label>
<input type="number" name="limite" value="{{ presupuesto.limite|floatformat:0 }}" class="w-full p-2 border rounded">
</div>

<div>
<label class="block mb-1 text-sm font-medium text-gray-600">Fecha inicio</label>
<input type="date" name="fecha_inicio" value="{{presupuesto.fecha_inicio|date:'Y-m-d'}}" class="w-full p-2 border rounded">
</div>

<div>
<label class="block mb-1 text-sm font-medium text-gray-600">Fecha fin</label>
<input type="date" name="fecha_fin" value="{{presupuesto.fecha_fin|date:'Y-m-d'}}" class="w-full p-2 border rounded">
</div>

<div class="flex items-center gap-2">
<input type="checkbox" name="isActivo" {% if presupuesto.isActivo %}checked{% endif %}>
<label class="text-sm text-gray-600">Activo</label>
</div>

<div>
<label class="block mb-1 text-sm font-medium text-gray-600">Categoria</label>

<input type="hidden" id="categoria_id" name="categoria" value="{{presupuesto.categoria.id}}">

<button type="button" onclick="abrirModalCategorias()" class="w-full p-2 border rounded bg-gray-50 hover:bg-gray-100">
{{presupuesto.categoria.nombre}}
</button>

{% include "presupuesto/modal_categorias.html" %}
</div>

<div class="flex justify-between mt-6">
<button type="button" onclick="cerrarModal()" class="px-4 py-2 text-gray-600 bg-gray-200 rounded hover:bg-gray-300">Cancelar</button>
<button type="submit" class="px-4 py-2 text-white bg-green-600 rounded hover:bg-green-700">Guardar</button>
</div>

</form>
</div>
</div>
