<div id="modal_categorias"
     class="fixed inset-0 items-center justify-center hidden bg-black bg-opacity-50">

    <div class="w-[500px] p-6 bg-white shadow-xl rounded-xl">

        <h3 class="mb-5 text-lg font-semibold text-gray-800">
            Seleccionar categoría
        </h3>

        <div class="grid grid-cols-3 gap-4">

            {% for c in categorias %}

                {% if c.tipo == "INGRESO" %}

                    <div onclick="seleccionarCategoria('{{c.id}}','{{c.nombre}}')"
                         class="p-3 text-center transition border border-green-200 rounded-lg cursor-pointer bg-green-50 hover:bg-green-100">

                        <p class="font-semibold text-black-700">
                            {{ c.nombre }}
                        </p>

                        <p class="text-xs text-green-600">
                            {{ c.tipo }}
                        </p>

                    </div>

                {% else %}

                    <div onclick="seleccionarCategoria('{{c.id}}','{{c.nombre}}')"
                         class="p-3 text-center transition border border-red-200 rounded-lg cursor-pointer bg-red-50 hover:bg-red-200">

                        <p class="font-semibold text-black-700">
                            {{ c.nombre }}
                        </p>

                        <p class="text-xs text-red-600">
                            {{ c.tipo }}
                        </p>

                    </div>

                {% endif %}

            {% endfor %}

        </div>

    </div>

</div>
