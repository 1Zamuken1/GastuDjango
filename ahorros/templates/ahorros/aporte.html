<h1>Registrar Aporte</h1>

<p><strong>Ahorro:</strong> {{ ahorro.descripcion }}</p>
<p><strong>Total actual:</strong> {{ ahorro.total_acumulado }}</p>

<form method="post">
    {% csrf_token %}
    
    <p>
        <label for="aporte">Monto a aportar:</label>
        <input type="number" 
               name="aporte" 
               id="aporte" 
               step="0.01" 
               value="{{ monto_sugerido|stringformat:'.2f' }}" 
               required>
    </p>
    
    <button type="submit">Aportar</button>
</form>

<hr>
<a href="{% url 'listar_ahorros' %}">Volver</a>
