{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada · GastuApp</title>
  <meta name="description" content="La página que buscas no existe o fue movida." />
  <link rel="icon" type="image/png" href="{% static 'img/gastu_logo_rostro.png' %}" />

  <!-- Tailwind -->
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
    }

    /* ── Stars / Particles ─────────────────── */
    .stars-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--dur) var(--delay) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: var(--max-op); transform: scale(1); }
    }

    /* ── Floating Owl ─────────────────────── */
    .owl-float {
      animation: owlFloat 4s ease-in-out infinite;
    }
    @keyframes owlFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-18px) rotate(2deg); }
    }

    /* ── Glow Ring ─────────────────────────── */
    .glow-ring {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.15);
      animation: pulseRing 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.1; }
    }

    /* ── 404 Number ─────────────────────────── */
    .error-number {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 40%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(16, 185, 129, 0.3));
      user-select: none;
    }

    /* ── CTA Button ─────────────────────────── */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(16, 185, 129, 0.35);
    }
    .cta-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 36px rgba(16, 185, 129, 0.5);
    }
    .cta-btn:active {
      transform: translateY(-1px) scale(1.01);
    }

    /* ── Subtitle ─────────────────────────── */
    .subtitle-glow {
      color: #94a3b8;
      font-size: 1.1rem;
      max-width: 420px;
      line-height: 1.6;
    }

    /* ── Floating orbs (ambient bg) ────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb--emerald {
      width: 400px;
      height: 400px;
      background: rgba(16, 185, 129, 0.08);
      top: -100px;
      right: -80px;
      animation: orbDrift 12s ease-in-out infinite alternate;
    }
    .orb--cyan {
      width: 300px;
      height: 300px;
      background: rgba(6, 182, 212, 0.06);
      bottom: -60px;
      left: -60px;
      animation: orbDrift 10s ease-in-out infinite alternate-reverse;
    }
    .orb--purple {
      width: 250px;
      height: 250px;
      background: rgba(139, 92, 246, 0.06);
      top: 50%;
      left: 50%;
      animation: orbDrift 14s ease-in-out infinite alternate;
    }
    @keyframes orbDrift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, -30px); }
    }
  </style>
</head>
<body>
  <!-- Ambient Orbs -->
  <div class="orb orb--emerald"></div>
  <div class="orb orb--cyan"></div>
  <div class="orb orb--purple"></div>

  <!-- Stars -->
  <div class="stars-container" id="stars"></div>

  <!-- Main Content -->
  <main style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem;">

    <!-- Owl + Glow -->
    <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
      <div class="glow-ring"></div>
      <img
        src="{% static 'img/owl_404_lost.png' %}"
        alt="GastuApp Owl Perdido"
        class="owl-float"
        style="width: 160px; height: 160px; object-fit: contain; position: relative; z-index: 2;"
      />
    </div>

    <!-- 404 Number -->
    <h1 class="error-number">404</h1>

    <!-- Title -->
    <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.6rem; color: #f1f5f9; margin: 0.5rem 0 0.75rem;">
      ¡Ups! Página no encontrada
    </h2>

    <!-- Subtitle -->
    <p class="subtitle-glow">
      Parece que esta página se perdió entre las cuentas.<br>
      No te preocupes, tu dinero sigue a salvo
    </p>

    <!-- CTA -->
    <div style="margin-top: 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
      <a href="/" class="cta-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Volver al inicio
      </a>
    </div>

    <!-- Footer -->
    <p style="margin-top: 3rem; font-size: 0.78rem; color: #475569;">
      GastuApp · Tu asistente financiero personal
    </p>
  </main>

  <script>
    // Generate twinkling stars
    (function () {
      const container = document.getElementById('stars');
      const count = 60;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
        s.style.setProperty('--delay', (Math.random() * 5) + 's');
        s.style.setProperty('--max-op', (0.3 + Math.random() * 0.7).toFixed(2));
        s.style.width = s.style.height = (2 + Math.random() * 2) + 'px';
        container.appendChild(s);
      }
    })();
  </script>
</body>
</html>
