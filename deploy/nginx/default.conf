upstream gastu_app {
    server web:8000;
}

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name gastu.duckdns.org 132.145.189.234;

    # Verificación de Certbot para renovación SSL Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS seguro
server {
    listen 443 ssl;
    server_name gastu.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/gastu.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gastu.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # Archivos estáticos de Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Archivos media de usuarios
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # WebSockets (Django Channels / Daphne)
    location /ws/ {
        proxy_pass http://gastu_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Peticiones HTTP regulares
    location / {
        proxy_pass http://gastu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}

